name: VPS container verification

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/vps/**
      - package.json
      - pnpm-lock.yaml
      - prisma/**
      - src/**
      - next.config.mjs
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - deploy/vps/**
      - package.json
      - pnpm-lock.yaml
      - prisma/**
      - src/**
      - next.config.mjs
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity:
    uses: ./.github/workflows/project-identity.yml

  verify-vps-container:
    needs: identity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ needs.identity.outputs.database-name }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ${{ needs.identity.outputs.database-name }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/${{ needs.identity.outputs.database-name }}
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-0123456789abcdef
      BETTER_AUTH_IP_HEADER: x-ci-client-ip
      PANCAKE_API_KEY: ci-only-pancake-placeholder
      PANCAKE_SHOP_ID: "920007"
      SEARCH_INDEXING_ENABLED: "false"
      PROJECT_SLUG: ${{ needs.identity.outputs.project-slug }}
      PRODUCTION_DOMAIN: ${{ needs.identity.outputs.production-domain }}
      # compose.yml now interpolates project identity instead of embedding it, so `docker compose`
      # needs these in the environment the same way deploy.sh supplies them on the VPS.
      COMPOSE_PROJECT_NAME: ${{ needs.identity.outputs.compose-project-name }}
      POSTGRES_DB: ${{ needs.identity.outputs.database-name }}
      APP_DOMAIN: ${{ needs.identity.outputs.production-domain }}
      BETTER_AUTH_URL: https://${{ needs.identity.outputs.production-domain }}
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # releases-v5

      - name: Validate host helper shell syntax
        run: |
          bash -n deploy/vps/deploy.sh
          bash -n deploy/vps/rollback.sh

      - name: Validate Compose model
        shell: bash
        run: |
          cp deploy/vps/env.example deploy/vps/.env.production
          sed -i "s/^RELEASE_SHA=.*/RELEASE_SHA=${GITHUB_SHA}/" deploy/vps/.env.production
          docker compose --env-file deploy/vps/.env.production -f deploy/vps/compose.yml config --quiet

      - name: Validate Caddy configuration
        run: >-
          docker run --rm
          -e APP_DOMAIN=localhost
          -v "${{ github.workspace }}/deploy/vps/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Build operations image
        run: docker build --target build --tag "$PROJECT_SLUG:vps-ops-ci" .

      - name: Verify Prisma OpenSSL detection
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm "$PROJECT_SLUG:vps-ops-ci" sh -lc '
            set -eu
            openssl version
            pnpm prisma:generate 2>&1 | tee /tmp/prisma-generate.log
            if grep -Fq "Prisma failed to detect the libssl/openssl version to use" /tmp/prisma-generate.log; then
              echo "Prisma still cannot detect OpenSSL" >&2
              exit 1
            fi
          '

      - name: Run release preflight and migrations in operations image
        shell: bash
        run: |
          docker run --rm --network host \
            -e DATABASE_URL \
            -e BETTER_AUTH_SECRET \
            -e BETTER_AUTH_IP_HEADER \
            -e PANCAKE_API_KEY \
            -e PANCAKE_SHOP_ID \
            -e SEARCH_INDEXING_ENABLED \
            -e APP_DOMAIN="$PRODUCTION_DOMAIN" \
            -e BETTER_AUTH_URL="https://$PRODUCTION_DOMAIN" \
            "$PROJECT_SLUG:vps-ops-ci" \
            sh -lc 'pnpm release:check && pnpm prisma:migrate:deploy'

      # The deploy path once shipped the Meta pixel inert because compose.yml passed no build arg,
      # and nothing caught it: every other check builds with an empty pixel id, so removing that
      # wiring again would stay green. This builds the way production does — through Compose, with
      # the id supplied the way .env.production supplies it — and asserts the image actually serves
      # the pixel under a policy that admits it.
      - name: Verify the Compose build carries the pixel id into the image
        shell: bash
        run: |
          set -euo pipefail
          pixel_id=123456789012345
          sed -i "s/^NEXT_PUBLIC_FACEBOOK_PIXEL_ID=.*/NEXT_PUBLIC_FACEBOOK_PIXEL_ID=${pixel_id}/" \
            deploy/vps/.env.production
          grep -q "^NEXT_PUBLIC_FACEBOOK_PIXEL_ID=${pixel_id}$" deploy/vps/.env.production

          docker compose --env-file deploy/vps/.env.production -f deploy/vps/compose.yml build app

          docker run -d --name "$PROJECT_SLUG-pixel-ci" --network host \
            -e DATABASE_URL \
            -e BETTER_AUTH_SECRET \
            -e BETTER_AUTH_IP_HEADER \
            -e PANCAKE_API_KEY \
            -e PANCAKE_SHOP_ID \
            -e SEARCH_INDEXING_ENABLED \
            -e APP_DOMAIN=127.0.0.1:3000 \
            -e BETTER_AUTH_URL=http://127.0.0.1:3000 \
            "$PROJECT_SLUG:${GITHUB_SHA}"

          cleanup() {
            docker rm -f "$PROJECT_SLUG-pixel-ci" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..50}; do
            if curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3000/shop; then
              break
            fi
            if [[ "${attempt}" == "50" ]]; then
              docker logs "$PROJECT_SLUG-pixel-ci"
              echo "pixel image never became reachable" >&2
              exit 1
            fi
            sleep 2
          done

          headers="$(curl --fail --silent --show-error --dump-header - --output /dev/null \
            http://127.0.0.1:3000/shop)"
          body="$(curl --fail --silent --show-error http://127.0.0.1:3000/shop)"

          # A build arg that never reached the image leaves both of these missing.
          grep -qi 'content-security-policy:.*https://connect\.facebook\.net' <<<"${headers}"
          grep -qi 'content-security-policy:.*https://www\.facebook\.com' <<<"${headers}"
          grep -q 'connect\.facebook\.net' <<<"${body}"
          grep -q "${pixel_id}" <<<"${body}"

          # Restore the untracked default so the health smoke below builds as production does today.
          sed -i "s/^NEXT_PUBLIC_FACEBOOK_PIXEL_ID=.*/NEXT_PUBLIC_FACEBOOK_PIXEL_ID=/" \
            deploy/vps/.env.production

      - name: Build production runtime image
        run: docker build --target runner --tag "$PROJECT_SLUG:vps-runtime-ci" .

      - name: Run production runtime health smoke
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name "$PROJECT_SLUG-vps-ci" --network host \
            -e DATABASE_URL \
            -e BETTER_AUTH_SECRET \
            -e BETTER_AUTH_IP_HEADER \
            -e PANCAKE_API_KEY \
            -e PANCAKE_SHOP_ID \
            -e SEARCH_INDEXING_ENABLED \
            -e APP_DOMAIN=127.0.0.1:3000 \
            -e BETTER_AUTH_URL=http://127.0.0.1:3000 \
            "$PROJECT_SLUG:vps-runtime-ci"

          cleanup() {
            docker rm -f "$PROJECT_SLUG-vps-ci" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..50}; do
            status="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}none{{end}}' "$PROJECT_SLUG-vps-ci")"
            if [[ "$status" == "healthy" ]]; then
              curl --fail --silent --show-error http://127.0.0.1:3000/shop >/dev/null
              exit 0
            fi
            if [[ "$status" == "unhealthy" ]]; then
              docker logs "$PROJECT_SLUG-vps-ci"
              exit 1
            fi
            sleep 2
          done

          docker logs "$PROJECT_SLUG-vps-ci"
          exit 1
