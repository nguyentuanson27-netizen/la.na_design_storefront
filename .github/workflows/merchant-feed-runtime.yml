name: Merchant feed runtime

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity:
    uses: ./.github/workflows/project-identity.yml

  merchant-feed-runtime:
    needs: identity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ needs.identity.outputs.database-name }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ${{ needs.identity.outputs.database-name }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/${{ needs.identity.outputs.database-name }}
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-0123456789abcdef
      BETTER_AUTH_URL: http://127.0.0.1:3220
      APP_DOMAIN: 127.0.0.1:3220
      SEARCH_INDEXING_ENABLED: "false"
      PANCAKE_SHOP_ID: "920007"
      NEXT_TELEMETRY_DISABLED: "1"
      LA_SHIPPING_FEE_VND: "17000"
      LA_FREE_SHIPPING_SUBTOTAL_VND: "650000"
      LA_FREE_SHIPPING_MIN_QUANTITY: "5"
      LA_MERCHANT_TARGET_COUNTRY: "VN"
      LA_MERCHANT_CONTENT_LANGUAGE: "vi"
      LA_MERCHANT_CURRENCY: "VND"
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # releases-v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install from lockfile without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Deploy database migrations
        run: pnpm prisma:migrate:deploy

      # Checkpoint B requires this exact command for T8A: it proves the Merchant identity the feed
      # would emit still resolves after the brand/default-gender facts moved into Brand Config. It
      # is read-only, never calls Pancake, and needs only the database and shop id already in this
      # job's environment. Runs before the build so an identity regression fails fast.
      - name: Merchant identity audit
        run: pnpm merchant:identity:audit

      - name: Build
        run: pnpm build

      - name: Exercise public Merchant feed route
        shell: bash
        run: |
          set -euo pipefail
          pnpm start --hostname 127.0.0.1 --port 3220 >"$RUNNER_TEMP/merchant-feed-runtime.log" 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..40}; do
            if ! kill -0 "$APP_PID" >/dev/null 2>&1; then
              cat "$RUNNER_TEMP/merchant-feed-runtime.log"
              exit 1
            fi
            if curl --fail --silent --show-error http://127.0.0.1:3220/ >/dev/null; then
              ready=1
              break
            fi
            sleep 0.5
          done
          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/merchant-feed-runtime.log"
            exit 1
          fi

          first_status="$(curl --silent --output "$RUNNER_TEMP/feed-first.txt" --dump-header "$RUNNER_TEMP/feed-first.headers" --write-out '%{http_code}' 'http://127.0.0.1:3220/feeds/google-merchant?country=VN&currency=VND&foo=1')"
          second_status="$(curl --silent --output "$RUNNER_TEMP/feed-second.txt" --dump-header "$RUNNER_TEMP/feed-second.headers" --write-out '%{http_code}' 'http://127.0.0.1:3220/feeds/google-merchant?country=US&currency=USD&foo=2')"

          test "$first_status" = "200"
          test "$second_status" = "200"
          grep -Fqi 'content-type: application/rss+xml; charset=utf-8' "$RUNNER_TEMP/feed-first.headers"
          grep -Fqi 'content-type: application/rss+xml; charset=utf-8' "$RUNNER_TEMP/feed-second.headers"
          grep -Fqi 'x-la-merchant-feed-state: generated' "$RUNNER_TEMP/feed-first.headers"
          grep -Fqi 'x-la-merchant-feed-state: hit' "$RUNNER_TEMP/feed-second.headers"
          grep -Fq '<rss version="2.0" xmlns:g="http://base.google.com/ns/1.0">' "$RUNNER_TEMP/feed-first.txt"
          cmp -s "$RUNNER_TEMP/feed-first.txt" "$RUNNER_TEMP/feed-second.txt"

          test "$(grep -Fc '[merchant-feed] cold_generation' "$RUNNER_TEMP/merchant-feed-runtime.log")" = "1"
          grep -Fq '[merchant-feed] generation_success' "$RUNNER_TEMP/merchant-feed-runtime.log"
          grep -Fq '[merchant-feed] success_cache_hit' "$RUNNER_TEMP/merchant-feed-runtime.log"
          if grep -Fq '[merchant-feed] market_unresolved' "$RUNNER_TEMP/merchant-feed-runtime.log"; then
            cat "$RUNNER_TEMP/merchant-feed-runtime.log"
            exit 1
          fi
