name: PR198 prepare reviewed file objects

# Temporary: validates tested source and creates unreferenced blobs only.
# Branch, tree, commit and workflow changes are left to the authorized connector.
on:
  push:
    branches: [feat/freeship-tu-2-set]
    paths: [.github/workflows/pr198-publish.yml]
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'nguyentuanson27-netizen/la.na_design_storefront'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      - name: Validate exact tested bytes and prepare unreferenced file objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request, urllib.error
          api_root = 'https://api.github.com/repos/nguyentuanson27-netizen/la.na_design_storefront'
          expected_tree = 'ebed938b20fc3980991f63c02ef0aeee2d50ddbd'
          parts = ['24300fb78c6a327134e63e6b8c3d71cb8efabb73', '3a3f6b32c6d56dc04930759ae64023606b4a1257',
                   'dc4dd3fd67f68313aeae791ae0244913f120cf3b', 'eecc3ede35ade11d120243058cefbd9743d26a30',
                   '9173372b087b0cec52f8202389ac9d0557b46558', '218d96cc824b308fe457258734e3476b081e57c1',
                   'ad52758336ac4b538e5f7e7c56d9008e18310257']
          def api(path, body=None):
              request = urllib.request.Request(api_root + path,
                  data=None if body is None else json.dumps(body).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28', 'Content-Type': 'application/json'},
                  method='GET' if body is None else 'POST')
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  message = json.loads(error.read()).get('message', 'GitHub request refused')
                  raise RuntimeError(str(error.code) + ': ' + message) from None
          def blob(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()
          def git(*args):
              return subprocess.check_output(['git', *args])
          chunks = []
          for sha in parts:
              chunk = base64.b64decode(api('/git/blobs/' + sha)['content'])
              assert blob(chunk) == sha
              chunks.append(chunk)
          encoded = b''.join(chunks)
          assert len(encoded) == 42188
          compressed = base64.b64decode(encoded, validate=True)
          assert hashlib.sha256(compressed).hexdigest() == 'e4df9bb9a01c9390c955ab80e0c277a24250da5ec88b2484dcdea50de776badc'
          decoder = lzma.LZMADecompressor(memlimit=256 * 1024 * 1024)
          raw = decoder.decompress(compressed, max_length=2 * 1024 * 1024)
          assert decoder.eof and not decoder.unused_data and len(raw) == 128403
          payload = json.loads(raw)
          assert payload['expectedTree'] == expected_tree and len(payload['files']) == 63
          for entry in payload['files']:
              path = pathlib.PurePosixPath(entry['path'])
              assert not path.is_absolute() and not any(p in ('..', '.git') for p in path.parts)
              target = pathlib.Path(path)
              assert not target.is_symlink() and not any(p.is_symlink() for p in target.parents)
              old = target.read_bytes() if target.exists() else None
              assert (None if old is None else blob(old)) == entry['before'], 'Source changed: ' + str(path)
              if entry['after'] is None:
                  target.unlink()
              else:
                  lines = (old or b'').decode('utf-8').splitlines(keepends=True)
                  for start, end, replacement in reversed(entry['edits']):
                      assert 0 <= start <= end <= len(lines)
                      lines[start:end] = [replacement]
                  new = ''.join(lines).encode('utf-8')
                  assert blob(new) == entry['after'], 'Edit mismatch: ' + str(path)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(new)
          for path in ('.github/workflows/pr198-db-workspace.yml', '.github/workflows/pr198-publish.yml'):
              pathlib.Path(path).unlink()
          git('add', '-A')
          git('diff', '--cached', '--check')
          assert git('write-tree').decode().strip() == expected_tree
          for entry in payload['files']:
              if entry['after'] is None:
                  continue
              data = pathlib.Path(entry['path']).read_bytes()
              result = api('/git/blobs', {'encoding': 'base64', 'content': base64.b64encode(data).decode()})
              assert result['sha'] == entry['after'], 'Remote blob mismatch: ' + entry['path']
              print('VERIFIED_BLOB ' + result['sha'] + ' ' + entry['path'], flush=True)
          print('VERIFIED_TREE=' + expected_tree)
          print('No tree, commit, branch, deployment or campaign was changed by this job.')
          PY
