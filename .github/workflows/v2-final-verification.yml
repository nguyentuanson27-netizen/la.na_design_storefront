name: V2 final verification

on:
  pull_request:

permissions:
  contents: read

jobs:
  identity:
    uses: ./.github/workflows/project-identity.yml

  v2:
    if: github.event.pull_request.head.ref == 'test/v1-v2-final-verification'
    needs: identity
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ needs.identity.outputs.database-name }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ${{ needs.identity.outputs.database-name }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/${{ needs.identity.outputs.database-name }}
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_IP_HEADER: x-ci-client-ip
      APP_DOMAIN: localhost:3000
      SEARCH_INDEXING_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out exact PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # releases-v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install from lockfile without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate Prisma schema
        run: pnpm prisma:validate

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Deploy database migrations
        run: pnpm prisma:migrate:deploy

      - name: V2 pnpm lint
        run: pnpm lint

      - name: V2 pnpm typecheck
        run: pnpm typecheck

      - name: V2 pnpm test:domain
        run: pnpm test:domain

      - name: V2 pnpm test
        run: pnpm test

      - name: V2 pnpm test:db
        run: pnpm test:db

      - name: V2 pnpm build
        env:
          LA_SHIPPING_FEE_VND: "17000"
          LA_FREE_SHIPPING_SUBTOTAL_VND: "650000"
          LA_FREE_SHIPPING_MIN_QUANTITY: "5"
        run: pnpm build

      - name: V2 pnpm release:check
        env:
          APP_DOMAIN: ${{ needs.identity.outputs.production-domain }}
          BETTER_AUTH_URL: https://${{ needs.identity.outputs.production-domain }}
          SEARCH_INDEXING_ENABLED: "false"
          PANCAKE_API_KEY: ci-only-pancake-placeholder
          PANCAKE_SHOP_ID: "920007"
          LA_SHIPPING_FEE_VND: "30000"
          LA_FREE_SHIPPING_SUBTOTAL_VND: "1000000"
          LA_FREE_SHIPPING_MIN_QUANTITY: "3"
        run: pnpm release:check
