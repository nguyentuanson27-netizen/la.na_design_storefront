name: V1 performance comparison

on:
  pull_request:

permissions:
  contents: read

jobs:
  compare:
    if: github.event.pull_request.head.ref == 'test/v1-v2-final-verification'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: lana_v1_performance
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d lana_v1_performance"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/lana_v1_performance
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-0123456789abcdef
      BETTER_AUTH_IP_HEADER: x-ci-client-ip
      PANCAKE_SHOP_ID: "920020"
      SEARCH_INDEXING_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out current PR head
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # releases-v5

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22

      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install current application
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate current Prisma client
        run: pnpm prisma:generate

      - name: Deploy current database schema
        run: pnpm prisma:migrate:deploy

      - name: Build current application
        env:
          APP_DOMAIN: 127.0.0.1:3241
          BETTER_AUTH_URL: http://127.0.0.1:3241
          LA_SHIPPING_FEE_VND: "30000"
          LA_FREE_SHIPPING_SUBTOTAL_VND: "1000000"
          LA_FREE_SHIPPING_MIN_QUANTITY: "3"
        run: pnpm build

      - name: Install pinned Playwright tooling
        working-directory: tests/a11y-runtime
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: tests/a11y-runtime
        run: npx playwright install --with-deps chromium

      - name: Check out exact baseline
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # releases-v5
        with:
          ref: 8f7b20552d7dee0df4dff8e662ce508276a65f72
          path: baseline

      - name: Install baseline application
        working-directory: baseline
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate baseline Prisma client
        working-directory: baseline
        run: pnpm prisma:generate

      - name: Build baseline application against the same database
        working-directory: baseline
        env:
          APP_DOMAIN: 127.0.0.1:3240
          BETTER_AUTH_URL: http://127.0.0.1:3240
          LA_SHIPPING_FEE_VND: "30000"
          LA_FREE_SHIPPING_SUBTOTAL_VND: "1000000"
          LA_FREE_SHIPPING_MIN_QUANTITY: "3"
        run: pnpm build

      - name: Compare Home PLP PDP with identical fixture and profile
        working-directory: tests/a11y-runtime
        env:
          V1_BASELINE_APP_ROOT: ${{ github.workspace }}/baseline
        run: npx playwright test --config v1-performance.config.ts
