name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  identity:
    uses: ./.github/workflows/project-identity.yml

  verify:
    needs: identity
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ needs.identity.outputs.database-name }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ${{ needs.identity.outputs.database-name }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/${{ needs.identity.outputs.database-name }}
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-0123456789abcdef
      BETTER_AUTH_URL: http://localhost:3000
      BETTER_AUTH_IP_HEADER: x-ci-client-ip
      APP_DOMAIN: localhost:3000
      SEARCH_INDEXING_ENABLED: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # releases-v5

      # Before `setup-node`, so its `cache: pnpm` can ask pnpm where its store is.
      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install from lockfile without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate Prisma schema
        run: pnpm prisma:validate

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Deploy database migrations
        run: pnpm prisma:migrate:deploy

      - name: Database smoke tests
        run: pnpm test:db

      - name: Next HTTP security smoke
        run: node --experimental-strip-types scripts/cart-server-action-http-smoke.ts

      - name: Guest checkout Server Action HTTP smoke
        env:
          PANCAKE_API_KEY: ci-only-pancake-placeholder
          PANCAKE_SHOP_ID: "920007"
        run: node --experimental-strip-types scripts/guest-checkout-server-action-http-smoke.ts

      - name: Authenticated admin HTTP authorization smoke
        run: node --experimental-strip-types scripts/admin-authz-http-smoke.ts

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Domain tests
        run: pnpm test

      - name: Build
        env:
          LA_SHIPPING_FEE_VND: "17000"
          LA_FREE_SHIPPING_SUBTOTAL_VND: "650000"
          LA_FREE_SHIPPING_MIN_QUANTITY: "5"
        run: pnpm build

      - name: Shipping promotion runtime policy smoke
        env:
          APP_DOMAIN: 127.0.0.1:3218
          BETTER_AUTH_URL: http://127.0.0.1:3218
          SEARCH_INDEXING_ENABLED: "false"
          LA_SHIPPING_FEE_VND: "25000"
          LA_FREE_SHIPPING_SUBTOTAL_VND: "750000"
          LA_FREE_SHIPPING_MIN_QUANTITY: "4"
        shell: bash
        run: |
          set -euo pipefail
          pnpm start --hostname 127.0.0.1 --port 3218 > "$RUNNER_TEMP/shipping-runtime.log" 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          ready=0
          for attempt in {1..30}; do
            if ! kill -0 "$APP_PID" >/dev/null 2>&1; then
              cat "$RUNNER_TEMP/shipping-runtime.log"
              exit 1
            fi
            if curl --fail --silent --show-error http://127.0.0.1:3218/ > "$RUNNER_TEMP/storefront.html"; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            cat "$RUNNER_TEMP/shipping-runtime.log"
            exit 1
          fi

          if grep -Fq "750.000" "$RUNNER_TEMP/storefront.html" && grep -Fq "4 sản phẩm" "$RUNNER_TEMP/storefront.html"; then
            if grep -Fq "650.000" "$RUNNER_TEMP/storefront.html" || grep -Fq "5 sản phẩm" "$RUNNER_TEMP/storefront.html"; then
              echo "Shipping promotion mixes runtime and build-time policy"
              exit 1
            fi
            echo "Shipping promotion resolved the runtime policy"
            exit 0
          fi

          if grep -Fq "650.000" "$RUNNER_TEMP/storefront.html" && grep -Fq "5 sản phẩm" "$RUNNER_TEMP/storefront.html"; then
            echo "Shipping promotion rendered the build-time policy instead of the runtime policy"
            exit 1
          fi

          echo "Shipping promotion rendered an unexpected policy state"
          exit 1

      - name: Release environment preflight
        env:
          APP_DOMAIN: ${{ needs.identity.outputs.production-domain }}
          BETTER_AUTH_URL: https://${{ needs.identity.outputs.production-domain }}
          SEARCH_INDEXING_ENABLED: "false"
          PANCAKE_API_KEY: ci-only-pancake-placeholder
          PANCAKE_SHOP_ID: "920007"
          RESEND_API_KEY: re_ci-only-contact-placeholder
          LA_SHIPPING_FEE_VND: "30000"
          LA_FREE_SHIPPING_SUBTOTAL_VND: "1000000"
          LA_FREE_SHIPPING_MIN_QUANTITY: "3"
        run: pnpm release:check

      - name: Production start smoke
        env:
          APP_DOMAIN: 127.0.0.1:3219
          BETTER_AUTH_URL: http://127.0.0.1:3219
          SEARCH_INDEXING_ENABLED: "false"
          PANCAKE_SHOP_ID: "920007"
          NEXT_TELEMETRY_DISABLED: "1"
        shell: bash
        run: |
          set -euo pipefail
          pnpm start --hostname 127.0.0.1 --port 3219 >"$RUNNER_TEMP/next-start.log" 2>&1 &
          APP_PID=$!
          cleanup() {
            kill "$APP_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          SERVER_READY=false
          for attempt in {1..40}; do
            if ! kill -0 "$APP_PID" >/dev/null 2>&1; then
              cat "$RUNNER_TEMP/next-start.log"
              exit 1
            fi
            if curl --fail --silent --show-error http://127.0.0.1:3219/ >/dev/null 2>&1; then
              SERVER_READY=true
              break
            fi
            sleep 0.5
          done

          if [[ "$SERVER_READY" != "true" ]]; then
            echo "Timed out waiting for production server to respond on port 3219" >&2
            cat "$RUNNER_TEMP/next-start.log"
            exit 1
          fi

          node --input-type=module -e '
            import assert from "node:assert/strict";
            const response = await fetch("http://127.0.0.1:3219/", {
              headers: { "User-Agent": "Google-Site-Verification/1.0" },
              redirect: "manual",
            });
            assert.equal(response.status, 200, `Expected 200 OK from homepage, got ${response.status}`);
            const html = await response.text();
            const headMatch = html.match(/<head\b[^>]*>([\s\S]*?)<\/head>/i);
            assert.ok(headMatch, "Expected <head>...</head> in HTML response");
            const head = headMatch[1];
            const token = "N2OZE83tu6EA4bc-oP1u2uhDYBrDwLKJJCZstMm5lhs";
            const metaPattern = new RegExp(`<meta\\b[^>]*name=["\x27]google-site-verification["\x27][^>]*content=["\x27]${token}["\x27]|<meta\\b[^>]*content=["\x27]${token}["\x27][^>]*name=["\x27]google-site-verification["\x27]`, "i");
            assert.ok(metaPattern.test(head), `Expected google-site-verification meta tag with token ${token} inside <head>`);
            console.log("Production start smoke verified: 200 OK and Google-Site-Verification/1.0 crawler receives meta tag in <head>");
          '

  admin-a11y-runtime:
    needs: identity
    # Ubuntu, not macOS. The job was on `macos-14` from the initial import with no recorded reason,
    # and `p18-final-qa.yml` already drives the same Playwright + Chromium tooling on ubuntu, so
    # there is nothing here that needs a mac. GitHub bills macOS minutes at ten times the Linux
    # rate, and on identical steps in the same run Linux was the faster of the two anyway
    # (`pnpm install` 9.0s against 17.7s).
    runs-on: ubuntu-latest
    # Four shards, each on its own runner with its own database. The suite used to run as one
    # serial 12.6-minute block; the specs cannot share a worker because they park and restore
    # global rows, so the parallelism is taken across machines instead of inside one.
    #
    # `fail-fast: false` on purpose: one shard going red should still let the others report, or a
    # single failure hides the state of three quarters of the suite.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    # A ceiling for a hung shard, not a target. Each shard is expected to finish in a few minutes,
    # and a run that approaches this number is a regression worth reading rather than a new normal
    # to raise again.
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ needs.identity.outputs.database-name }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ${{ needs.identity.outputs.database-name }}"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/${{ needs.identity.outputs.database-name }}
      BETTER_AUTH_SECRET: ci-only-placeholder-secret-0123456789abcdef
      # Each spec spawns its server on its own port and passes its own `BETTER_AUTH_URL`; this is
      # only the fallback for anything that does not, and is deliberately not a spec's port.
      BETTER_AUTH_URL: http://127.0.0.1:3000
      BETTER_AUTH_IP_HEADER: x-ci-client-ip
      APP_DOMAIN: 127.0.0.1:3000
      SEARCH_INDEXING_ENABLED: "false"
      PANCAKE_SHOP_ID: "920942"
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # releases-v5

      # Before `setup-node`, so its `cache: pnpm` can ask pnpm where its store is.
      - name: Enable corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pinned pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install application from lockfile without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Generate Prisma client
        run: pnpm prisma:generate

      - name: Deploy database migrations
        run: pnpm prisma:migrate:deploy

      - name: Install pinned accessibility runtime tooling
        working-directory: tests/a11y-runtime
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Install Playwright Chromium
        working-directory: tests/a11y-runtime
        run: npx playwright install --with-deps chromium

      - name: Run admin browser accessibility runtime
        working-directory: tests/a11y-runtime
        run: npx playwright test --config playwright.config.ts --shard=${{ matrix.shard }}/4
