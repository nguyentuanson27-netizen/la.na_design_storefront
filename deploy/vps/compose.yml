name: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME}

services:
  postgres:
    image: ${POSTGRES_IMAGE:?set POSTGRES_IMAGE}
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - backend

  app:
    image: ${PROJECT_SLUG:?set PROJECT_SLUG}:${RELEASE_SHA:?set RELEASE_SHA}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: runner
      args:
        # The pixel id has to reach the image at build time: next.config.mjs assembles the
        # Content-Security-Policy from it and Next bakes that policy into the build. Passing it
        # only through .env.production would ship a script the policy then blocks.
        NEXT_PUBLIC_FACEBOOK_PIXEL_ID: ${NEXT_PUBLIC_FACEBOOK_PIXEL_ID:-}
        NEXT_PUBLIC_OPENAI_ADS_PIXEL_ID: ${NEXT_PUBLIC_OPENAI_ADS_PIXEL_ID:-}
        NEXT_PUBLIC_ZALO_ADS_PIXEL_ID: ${NEXT_PUBLIC_ZALO_ADS_PIXEL_ID:-}
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      # Project identity reaches the container from project.config.json through deploy.sh, not from
      # .env.production: only secrets live in that file now.
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/shop').then((response)=>{if(!response.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  ops:
    # Tagged by release so `catalog-sync` runs exactly this release's code, and a rollback can start
    # the previous release's sync from its own image.
    image: ${PROJECT_SLUG:?set PROJECT_SLUG}-ops:${RELEASE_SHA:?set RELEASE_SHA}
    build:
      context: ../..
      dockerfile: Dockerfile
      target: build
    profiles:
      - ops
    env_file:
      - .env.production
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL}
      # release:check compares this against project.config.json before any migration runs.
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  # The recurring Pancake catalog sync. A COMMITTED capacity reservation stops holding only once a
  # stock observation that began after the commit has landed (ADR 0014 §4.1), so without this loop
  # sellable capacity could only fall and a Pancake restock would never reach the storefront. It
  # writes the database, so deploy.sh stops it with the app before migrations and starts it with the
  # new release.
  catalog-sync:
    image: ${PROJECT_SLUG:?set PROJECT_SLUG}-ops:${RELEASE_SHA:?set RELEASE_SHA}
    restart: unless-stopped
    command: ["pnpm", "pancake:catalog:sync", "--loop"]
    env_file:
      - .env.production
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?set BETTER_AUTH_URL}
    # A sync is one database transaction of up to 60s; give an in-flight one time to commit on stop.
    stop_grace_period: 90s
    # Healthy only while a sync has recently succeeded, not merely while the loop is running: the loop
    # survives failures by design, so without this a bad Pancake config would look fine forever.
    # start_period covers the first sync, which starts immediately.
    healthcheck:
      test: ["CMD", "node", "--experimental-strip-types", "scripts/catalog-sync-health.ts"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 300s
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - backend

  # This host already runs nginx-proxy-manager (NPM) for unrelated production
  # services. NPM owns host 80/81/443, terminates TLS, and forwards to Caddy
  # over the external edge network. Caddy must not publish those host ports.
  caddy:
    image: ${CADDY_IMAGE:?set CADDY_IMAGE}
    restart: unless-stopped
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?set APP_DOMAIN}
      EDGE_TRUSTED_PROXY_CIDR: ${EDGE_TRUSTED_PROXY_CIDR:?set EDGE_TRUSTED_PROXY_CIDR}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      backend:
      edge:
        aliases:
          - ${COMPOSE_PROJECT_NAME:?set COMPOSE_PROJECT_NAME}-caddy

networks:
  backend:
    driver: bridge
  # Pre-existing Docker network owned by the shared NPM stack. The default is
  # deliberately non-production; deployment fails unless that network exists.
  edge:
    external: true
    name: ${EDGE_NETWORK_NAME:?set EDGE_NETWORK_NAME}

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
