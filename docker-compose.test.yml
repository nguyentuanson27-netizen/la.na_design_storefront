services:
  postgres:
    image: postgres:16
    container_name: la-na-design-test-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: la_na_design
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d la_na_design"]
      interval: 5s
      timeout: 5s
      retries: 5
